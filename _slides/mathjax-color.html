<script type="text/x-mathjax-config">

</script>
<script type="text/x-mathjax-config">
    MathJax.Hub.Register.StartupHook("TeX color Ready", function() {
        MathJax.Extension["TeX/color"].colors["p0"] = '#b3b3b3';
        MathJax.Extension["TeX/color"].colors["p1"] = '#4DFF4D';
        MathJax.Extension["TeX/color"].colors["s1"] = '#F2F249';
        MathJax.Extension["TeX/color"].colors["s2"] = '#4949F2';
    });
</script>
